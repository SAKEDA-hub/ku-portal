# Деплой всего проекта на alwaysdata при каждом push в main.
#
# alwaysdata раздаёт сайт, API, онлайн-экзамен и KU Message с одного Node.js-процесса.
# Секреты репозитория (Settings → Secrets and variables → Actions → Secrets):
#      ALWAYSDATA_ACCOUNT       — имя аккаунта alwaysdata (сайт: https://<имя>.alwaysdata.net)
#      ALWAYSDATA_SSH_PASSWORD  — пароль SSH-пользователя (alwaysdata → Remote access → SSH)
#      ALWAYSDATA_API_TOKEN     — API-токен (alwaysdata → Profile → Tokens)
#      ALWAYSDATA_SITE_ID       — ID сайта (число в адресе страницы сайта в панели alwaysdata)
# Переменная Actions ALWAYSDATA_KNOWN_HOSTS задаёт проверенный публичный SSH-ключ хоста.
# При отсутствии учётных данных SSH шаг выкладки пропускается.
# Репозиторий обновляется в ~/ku-portal, а запущенный сайт получает код в ~/ku-portal-mysql-new/KU-Portal.
# Каталог данных data/ не входит в git и не затрагивается.
# Старый адрес GitHub Pages можно оставить как резервный, но основной сайт открывайте на alwaysdata.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JS syntax
        run: |
          for f in server.js server/*.js scripts/*.js exam-sync/*.js public/*.js ku-message/*.js results/*.js admin/*.js; do
            node --check "$f"
          done
      - name: Run backend tests
        run: npm test

  backend:
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: backend
      cancel-in-progress: false
    env:
      ACCOUNT: ${{ secrets.ALWAYSDATA_ACCOUNT }}
      SSHPASS: ${{ secrets.ALWAYSDATA_SSH_PASSWORD }}
      API_TOKEN: ${{ secrets.ALWAYSDATA_API_TOKEN }}
      SITE_ID: ${{ secrets.ALWAYSDATA_SITE_ID }}
      KNOWN_HOSTS: ${{ vars.ALWAYSDATA_KNOWN_HOSTS }}
    steps:
      - name: Check secrets
        id: cfg
        run: |
          if [ -z "$ACCOUNT" ] || [ -z "$SSHPASS" ]; then
            echo "::notice::Секреты alwaysdata не заданы — деплой backend пропущен."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          elif [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Для SSH-деплоя задайте проверенный публичный ключ сервера в ALWAYSDATA_KNOWN_HOSTS."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != '1'

      - name: Upload code to alwaysdata
        if: steps.cfg.outputs.skip != '1'
        run: |
          sudo apt-get install -y -qq sshpass > /dev/null
          HOST="ssh-${ACCOUNT}.alwaysdata.net"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 ${ACCOUNT}@${HOST}"
          # Только файлы из git; существующий каталог данных MySQL остаётся на месте.
          git archive --format=tar HEAD | $SSH 'mkdir -p ~/ku-portal && tar -xf - -C ~/ku-portal'
          git archive --format=tar HEAD | $SSH 'mkdir -p ~/ku-portal-mysql-new/KU-Portal && tar -xf - -C ~/ku-portal-mysql-new/KU-Portal'
          git rev-parse HEAD | $SSH 'read -r sha; for d in ~/ku-portal ~/ku-portal-mysql-new/KU-Portal; do printf "%s\n" "$sha" > "$d/.release-commit.tmp" && mv "$d/.release-commit.tmp" "$d/.release-commit"; done'

      - name: Restart site
        if: steps.cfg.outputs.skip != '1'
        run: |
          if [ -z "$API_TOKEN" ] || [ -z "$SITE_ID" ]; then
            echo "::warning::Нет ALWAYSDATA_API_TOKEN или ALWAYSDATA_SITE_ID — перезапустите сайт вручную: alwaysdata → Web → Sites → Restart."
            exit 0
          fi
          curl -fsS -X POST --basic --user "${API_TOKEN} account=${ACCOUNT}:" \
            "https://api.alwaysdata.com/v1/site/${SITE_ID}/restart/"
          echo "site restarted"

      - name: Health check
        if: steps.cfg.outputs.skip != '1'
        run: |
          URL="https://${ACCOUNT}.alwaysdata.net/api/version"
          EXPECTED=$(git rev-parse --short=7 HEAD | cut -c1-7)
          for i in 1 2 3 4 5 6; do
            actual=$(curl -fsS --max-time 8 "$URL" | jq -r '.commit // empty' || true)
            echo "try $i: expected $EXPECTED, running $actual"
            [ "$actual" = "$EXPECTED" ] && exit 0
            sleep 10
          done
          echo "::error::Сервер не подтвердил запрошенную версию — проверьте перезапуск и журнал alwaysdata."
          exit 1
