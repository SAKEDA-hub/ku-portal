name: Review checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for f in server.js server/*.js scripts/*.js exam-sync/*.js public/*.js ku-message/*.js results/*.js admin/*.js; do
            node --check "$f"
          done
      - name: Run tests
        run: npm test
