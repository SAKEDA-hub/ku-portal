<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KU Connect — Kozybayev University</title>
  <link rel="icon" type="image/png" href="../bird-idle.png">
  <meta name="theme-color" content="#05a4ba">
  <!-- тема до загрузки скриптов (без «мигания»); дальше — applyTheme() в core.js -->
  <script>try{var t=JSON.parse(localStorage.getItem('kuc_theme')||'null');if(t){var r=document.documentElement;if(t.palette&&t.palette!=='ku')r.dataset.palette=t.palette;if(t.dark)r.dataset.mode='dark';if(t.fs&&t.fs!=='md')r.dataset.fs=t.fs}}catch(e){}</script>
  <link rel="stylesheet" href="connect.css">
</head>
<body>
  <div id="app"></div>
  <!-- словарь RU/KK/EN общий с порталом: public/i18n.js -->
  <script src="../i18n.js"></script>
  <script src="core.js"></script>
  <script src="tools.js"></script>
  <script src="settings.js"></script>
  <script src="views.js"></script>
</body>
</html>
