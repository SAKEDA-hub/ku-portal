/* ---------- оценивание (чистая функция) ---------- */
function norm(s, cs){ s = String(s ?? '').trim().replace(/\s+/g,' ').replace(/[’‘`´]/g,"'"); return cs ? s : s.toLowerCase(); }
const leftName = (p, j) => p.label || (p.audio ? 'голос ' + (j + 1) : 'картинка ' + (j + 1));
function grade(q, a, aux){
  const max = +q.points || 0; let frac = 0, empty = false, user = '—', corr = '';
  switch(q.type){
    case 'single':
      empty = a == null; if(!empty){ user = q.options[a]; frac = a === q.correct ? 1 : 0; }
      corr = q.options[q.correct]; break;
    case 'multi': {
      const sel = Array.isArray(a) ? a : []; const C = new Set(q.correct);
      empty = !sel.length;
      user = sel.slice().sort((x,y)=>x-y).map(j=>q.options[j]).join(', ') || '—';
      corr = q.correct.slice().sort((x,y)=>x-y).map(j=>q.options[j]).join(', ');
      const right = sel.filter(j=>C.has(j)).length, wrong = sel.length - right;
      frac = q.partial ? Math.max(0, (right - wrong) / C.size) : (wrong === 0 && right === C.size ? 1 : 0);
      break; }
    case 'tf': {
      const Y = q.labels === 'yn' ? 'Да' : 'Верно', N = q.labels === 'yn' ? 'Нет' : 'Неверно';
      empty = a == null; user = empty ? '—' : (a ? Y : N);
      corr = q.correct ? Y : N; frac = !empty && a === q.correct ? 1 : 0; break; }
    case 'gaps': {
      const gs = gapList(q.body), vals = (Array.isArray(a) ? a : []).map(v => String(v ?? '').trim());
      empty = !vals.some(Boolean); let ok = 0;
      gs.forEach((g, k) => { if(vals[k] && g.answers.some(x => norm(x, q.caseSensitive) === norm(vals[k], q.caseSensitive))) ok++; });
      user = empty ? '—' : gapFill(q.body, vals); corr = gapFill(q.body, gs.map(g => g.answers[0]));
      frac = !gs.length ? 0 : q.partial ? ok / gs.length : (ok === gs.length ? 1 : 0);
      break; }
    case 'input': {
      const v = String(a ?? '').trim(); empty = !v; user = v || '—';
      corr = q.answers.join(' / ');
      frac = !empty && q.answers.some(x => norm(x, q.caseSensitive) === norm(v, q.caseSensitive)) ? 1 : 0;
      break; }
    case 'match': {
      const map = (a && a.map) || {}; const n = q.pairs.length; let ok = 0, cnt = 0; const parts = [];
      q.pairs.forEach((p, j) => { const k = map[j];
        if(k != null){ cnt++; if(q.pairs[k].right === p.right) ok++; }
        parts.push(leftName(p,j) + ' → ' + (k != null ? q.pairs[k].right : '?')); });
      empty = cnt === 0; user = empty ? '—' : parts.join('; ');
      corr = q.pairs.map((p,j) => leftName(p,j) + ' → ' + p.right).join('; ');
      frac = q.partial ? ok / n : (ok === n ? 1 : 0);
      break; }
    case 'order': {
      const seq = (Array.isArray(a) ? a : []).map(p => q.items[aux.pool[p]]);
      empty = !seq.length; user = seq.join(orderJoin(q)) || '—'; corr = q.items.join(orderJoin(q));
      if(q.partial){ let ok = 0; q.items.forEach((w,k) => { if(seq[k] === w) ok++; }); frac = ok / q.items.length; }
      else frac = seq.length === q.items.length && seq.every((w,k) => w === q.items[k]) ? 1 : 0;
      break; }
  }
  const earned = r1(max * frac);
  const status = empty ? 'empty' : frac >= 1 ? 'correct' : frac > 0 ? 'partial' : 'wrong';
  return { earned, max, status, user, corr };
}

function validateTest(t){
  const e = [];
  if(!t.title.trim()) e.push(L('Укажите название теста', 'Enter a test title', 'Тест атауын енгізіңіз'));
  if(!(t.timeLimit >= 0)) e.push(L('Лимит времени не может быть отрицательным', 'Time limit cannot be negative', 'Уақыт шегі теріс болмауы керек'));
  if(!(t.passPercent >= 0 && t.passPercent <= 100)) e.push(L('Проходной порог — от 0 до 100 %', 'Pass mark must be between 0 and 100%', 'Өту шегі — 0-ден 100 %-ға дейін'));
  if(!t.questions.length) e.push(L('Добавьте хотя бы одно задание', 'Add at least one question', 'Кемінде бір тапсырма қосыңыз'));
  t.questions.forEach((q, i) => {
    const n = L('Задание ', 'Question ', 'Тапсырма ')+(i+1)+': ';
    if(!q.text.trim() && q.type !== 'gaps') e.push(n+L('нет текста вопроса', 'question text is missing', 'сұрақ мәтіні жоқ'));
    if(q.type === 'gaps'){ const gs = gapList(q.body);
      if(!gs.length) e.push(n+L('отметьте пропуски квадратными скобками: I [went] home', 'mark the gaps with square brackets: I [went] home', 'бос орындарды тік жақшамен белгілеңіз: I [went] home'));
      if(gs.some(g => !g.answers.some(Boolean))) e.push(n+L('есть пустой пропуск []', 'there is an empty gap []', 'бос орын [] бар')); }
    if(!(q.points > 0 && q.points <= 1000)) e.push(n+L('баллы должны быть больше 0', 'points must be greater than 0', 'ұпай 0-ден көп болуы керек'));
    if(q.type === 'single' || q.type === 'multi'){
      if(q.options.length < 2) e.push(n+L('нужно минимум 2 варианта', 'at least 2 options are required', 'кемінде 2 нұсқа қажет'));
      if(q.options.some(o => !o.trim())) e.push(n+L('есть пустые варианты ответа', 'some answer options are empty', 'бос жауап нұсқалары бар'));
      if(q.type === 'single' && !(q.correct >= 0 && q.correct < q.options.length)) e.push(n+L('отметьте правильный вариант', 'mark the correct option', 'дұрыс нұсқаны белгілеңіз'));
      if(q.type === 'multi' && !q.correct.length) e.push(n+L('отметьте хотя бы один правильный вариант', 'mark at least one correct option', 'кемінде бір дұрыс нұсқаны белгілеңіз'));
    }
    if(q.type === 'input' && !q.answers.some(a => a.trim())) e.push(n+L('укажите хотя бы один правильный ответ', 'add at least one correct answer', 'кемінде бір дұрыс жауапты көрсетіңіз'));
    if(q.type === 'match'){
      if(q.pairs.length < 2) e.push(n+L('нужно минимум 2 пары', 'at least 2 pairs are required', 'кемінде 2 жұп қажет'));
      const lk = matchLeft(q);
      if(q.pairs.some(p => !(lk === 'img' ? p.img : lk === 'audio' ? p.audio : String(p.label || '').trim()))) e.push(n+(lk === 'img' ? L('загрузите картинку в каждой паре', 'upload an image in every pair', 'әр жұпқа сурет жүктеңіз') : lk === 'audio' ? L('запишите или загрузите голосовое в каждой паре', 'record or upload a voice clip in every pair', 'әр жұпқа дауыс жазып немесе жүктеңіз') : L('заполните слово слева в каждой паре', 'fill in the left word in every pair', 'әр жұптағы сол жақ сөзді толтырыңыз')));
      if(q.pairs.some(p => !p.right.trim())) e.push(n+L('заполните ответ справа в каждой паре', 'fill in the right answer in every pair', 'әр жұптағы оң жақ жауапты толтырыңыз'));
    }
    if(q.type === 'order' && q.items.length < 2) e.push(n+(q.unit === 'letter' ? L('нужно слово минимум из 2 букв', 'the word needs at least 2 letters', 'сөзде кемінде 2 әріп болуы керек') : L('нужно минимум 2 слова', 'at least 2 words are required', 'кемінде 2 сөз қажет')));
  });
  return e;
}

let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
function overlay(html, cls = ''){
  const ov = document.createElement('div'); ov.className = 'ov ' + cls; ov.innerHTML = html;
  const prev = document.activeElement;
  ov._close = () => { if(ov._closed) return; ov._closed = true; ov.classList.remove('in'); setTimeout(() => ov.remove(), 200); if(prev && prev.focus && document.contains(prev)) prev.focus({preventScroll:true}); };
  ov.addEventListener('click', e => { if(e.target === ov || e.target.closest('[data-close]')) ov._close(); });
  document.body.appendChild(ov); requestAnimationFrame(() => ov.classList.add('in'));
  return ov;
}
function closeOverlays(){ document.querySelectorAll('.ov').forEach(o => o._close && o._close()); }

function formModal(title, fields, vals, onSave, o = {}){
  const ov = overlay(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="fm-t"><div class="ov-h"><button class="xclose" data-close aria-label="${L('Закрыть', 'Close', 'Жабу')}">${ico('backc')}</button><h3 id="fm-t">${esc(title)}</h3></div>
    ${o.text ? `<p>${esc(o.text)}</p>` : ''}
    <form class="fm" novalidate>${fields.map(f => `<label class="f" for="fm-${f.k}">${esc(f.label)}</label>${f.multi
        ? `<textarea class="field" id="fm-${f.k}" rows="${f.rows || 3}">${esc(vals[f.k] || '')}</textarea>`
        : `<input class="field" id="fm-${f.k}" type="${f.type || 'text'}" value="${esc(vals[f.k] || '')}" autocomplete="${f.ac || 'off'}" ${f.im ? `inputmode="${f.im}"` : ''} ${f.type === 'password' ? '' : 'autocapitalize="off"'}>`}`).join('')}
      <div class="lg-err" id="fm-err" role="alert"></div>
      <div class="btns fm-btns"><button type="button" class="btn sec" data-close>${esc(o.cancel || L('Отмена', 'Cancel', 'Болдырмау'))}</button><button class="btn" type="submit">${esc(o.ok || L('Сохранить', 'Save', 'Сақтау'))}</button></div></form></div>`);
  const form = ov.querySelector('form');
  form.addEventListener('submit', e => {
    e.preventDefault();
    const out = {}; fields.forEach(f => { const v = form.querySelector('#fm-' + f.k).value; out[f.k] = f.type === 'password' ? v : v.trim(); });
    const err = onSave(out);
    if(err){ ov.querySelector('#fm-err').textContent = err; const f = form.querySelector('input,textarea'); if(f) f.focus(); return; }
    ov._close(); if(o.after) setTimeout(o.after, 0);
  });
  setTimeout(() => { const f = form.querySelector('input,textarea'); if(f) f.focus(); }, 40);
}

const TF_TR = { en:{'Верно':'True', 'Неверно':'False', 'Да':'Yes', 'Нет':'No'}, kk:{'Верно':'Дұрыс', 'Неверно':'Дұрыс емес', 'Да':'Иә', 'Нет':'Жоқ'} };

function loadImage(file, cb){
  const fr = new FileReader();
  fr.onload = () => { const img = new Image(); img.onload = () => {
      const m = 240, k = Math.min(1, m / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); cb(c.toDataURL('image/webp', .85));
    }; img.onerror = () => toast(L('Файл не является изображением', 'The file is not an image', 'Файл сурет емес')); img.src = fr.result; };
  fr.readAsDataURL(file);
}

// студент видит экзамен своей группы, пока он не завершён (после срока экзамен исчезает; результаты остаются в «Мои результаты»).

/* Плитка экзамена: шапка в цвете предмета с названием, обложка, внизу — серая полоса с круглой кнопкой (цвет — из настроек оформления).

const roomSubj = r => { if(r.subject && SUBJECTS.some(x => x.id === r.subject)) return r.subject; const o = userById(r.ownerId); return o && o.subject || 'other'; };

function vExamS(){
  const doneRooms = D.rooms.filter(r => roomForUser(r, ME) && xFlow(r) && rrDone(r, ME.id));

// проверка перед завершением: ответ в каждом задании с вариантами, хоть одно слово в письме, оценённый спикинг
function rrMissing(r){
  const room = roomById(r.roomId), out = [];
  r.secs.forEach((k, i) => {
    if(k === 'speaking'){ if(!rrSpGrade(room, ME.id)) out.push({ i, txt:queueFor(room.id, ME.id) ? L('Спикинг ещё не оценён — дождитесь своей очереди', 'Speaking is not graded yet — wait for your turn', 'Спикинг әлі бағаланбаған — кезегіңізді күтіңіз') : L('Спикинг: запишитесь в очередь и ответьте преподавателю', 'Speaking: join the queue and answer the teacher', 'Спикинг: кезекке жазылып, оқытушыға жауап беріңіз') }); return; }
    const c = rrCount(r, k); if(c.a < c.n) out.push({ i, txt:xSecName(r.test.exam, k) + ': ' + (k === 'writing' ? L(`не написано ${c.n - c.a} из ${c.n}`, `${c.n - c.a} of ${c.n} not written`, `${c.n} ішінен ${c.n - c.a} жазылмаған`) : L(`без ответа ${c.n - c.a} из ${c.n}`, `${c.n - c.a} of ${c.n} unanswered`, `${c.n} ішінен ${c.n - c.a} жауапсыз`)) });
  });
  return out;
}
function rrFinishAsk(){
  const r = S.run; if(!r) return;

  ask(L('Завершить тест?', 'Finish the test?', 'Тестті аяқтау керек пе?'), L('Все задания выполнены. После завершения изменить ответы будет нельзя.', 'All tasks are done. You won’t be able to change your answers after finishing.', 'Барлық тапсырма орындалды. Аяқтағаннан кейін жауаптарды өзгерту мүмкін болмайды.'),

// сдача: онлайн-навыки — попытка с авто-баллами по навыкам; письмо — работа на проверку; спикинг уже оценён в очереди
async function finishRoom(auto){
  const r = S.run; if(!r) return;
  const room = roomById(r.roomId); closeOverlays(); stopTimer();
  if(!room || rrDone(room, ME.id)){ S.run = null; dropRunSave(); go('room', { id:r.roomId }, { force:true, replace:true }); return; }
  const t = r.test, now = Date.now(), lim = t.timeLimit * 60000;
  const duration = lim > 0 ? Math.min(runElapsed(r), lim) : runElapsed(r);
  const allSecs = r.secs;
  if(ME.role === 'student'){
    try{
      await examCommand('attempt', { roomId:room.id, testId:t.id, answers:r.answers, exam:true, auto:!!auto });
      if(room.writing.on && !writingFor(room.id, ME.id) && allSecs.includes('writing')){
        const es = t.exam.sections.writing.tasks.filter(x => x.type === 'essay');
        const nums = XM.numberTasks(t.exam.sections.writing);
        const text = es.map(x => (es.length > 1 ? L('Задание ', 'Task ', 'Тапсырма ') + nums[t.exam.sections.writing.tasks.indexOf(x)] + '\n' : '') + String(r.answers[x.id] || '').trim()).join('\n\n').trim();
        if(text) await examCommand('writing', { roomId:room.id, text, auto:!!auto });
      }
    }catch(e){ toast(e.message); if(S.view === 'run') startTimer(); return; }
    S.run = null; S.rhud = null; dropRunSave();
    toast(auto ? L('Время вышло — тест сдан автоматически', 'Time is up — the test was submitted automatically', 'Уақыт бітті — тест автоматты түрде тапсырылды') : L('Тест сдан', 'Test submitted', 'Тест тапсырылды'));
    go('room', { id:room.id }, { force:true, replace:true }); return;
  }
  r.secs = allSecs.filter(k => XB_ONLINE.includes(k));
  const g = xGradeRun(r); r.secs = allSecs;
  const percent = g.max ? Math.round(g.score / g.max * 100) : 0;
  D.attempts.unshift({ id:uid(), userId:ME.id, roomId:room.id, testId:t.id, testTitle:t.title, startedAt:r.startedAt, finishedAt:now, duration, auto:!!auto, timeLimit:t.timeLimit,
    score:g.score, max:g.max, percent, passed:percent >= t.passPercent, passPercent:t.passPercent, showAnswers:t.showAnswers, details:g.details, xfinal:true });
  // письмо: все эссе раздела одной работой
  if(room.writing.on && !writingFor(room.id, ME.id) && allSecs.includes('writing')){
    const es = t.exam.sections.writing.tasks.filter(x => x.type === 'essay'), nums = XM.numberTasks(t.exam.sections.writing);
    const text = es.map(x => (es.length > 1 ? L('Задание ', 'Task ', 'Тапсырма ') + nums[t.exam.sections.writing.tasks.indexOf(x)] + '\n' : '') + String(r.answers[x.id] || '').trim()).join('\n\n').trim();
    D.writings.push({ id:uid(), roomId:room.id, userId:ME.id, text, words:wc(text), submittedAt:now, auto:!!auto });
  }
  // авто-баллы онлайн-навыков (вниз до половинок) — преподаватель может изменить их на странице проверки
  const p = progress(room, ME.id);
  if(p.test && p.test.done) p.test.skills.forEach(k => { const v = p.test.autoBy[k]; if(v == null || gradeFor(room.id, ME.id, k)) return;
    D.grades.push({ roomId:room.id, userId:ME.id, part:k, score:v, max:+room[k].max, comment:'', gradedAt:now, by:'auto', auto:true }); });
  tmDone(tmById(r.timerId));
  persist(); S.run = null; S.rhud = null; dropRunSave();
  toast(auto ? L('Время вышло — тест сдан автоматически', 'Time is up — the test was submitted automatically', 'Уақыт бітті — тест автоматты түрде тапсырылды') : L('Тест сдан', 'Test submitted', 'Тест тапсырылды'));
  go('room', { id:room.id }, { force:true, replace:true });
}
// вызов на спикинг / оценка во время прохождения — перерисовка без ожидания (вкладка прохождения не «живая»)
let RR_SIG = '';
function rrWatch(){
  if(S.view !== 'run' || !S.run || S.run.mode !== 'room'){ RR_SIG = ''; return; }
  const room = roomById(S.run.roomId); if(!room) return;
  const q = queueFor(room.id, ME.id), g = rrSpGrade(room, ME.id), b = !!rrBlock(room);
  const sig = [q ? q.status + ':' + queuePos(q) : '-', g ? g.score : '-', b].join('|');
  if(!RR_SIG){ RR_SIG = sig; return; }
  if(sig === RR_SIG) return;
  const blockChanged = RR_SIG.split('|')[2] !== String(b);
  RR_SIG = sig;
  if(blockChanged || !fieldFocused()){ const y = scrollY; render(); window.scrollTo(0, y); }
}

    (done.length ? `<div class="sect"><h2>${L('Завершены', 'Finished', 'Аяқталғандар')}</h2></div>${done.map(q => { const u = userById(q.userId); return u ? `<div class="donerow" role="button" tabindex="0" data-act="openGrade" data-room="${q.roomId}" data-user="${q.userId}">${avatarOf(u, 'sm')}<span class="grow ell">${esc(u.name)}</span><span class="num">${fmtT(q.duration)}</span>${gradeFor(q.roomId, q.userId, 'speaking') ? ico('check', 'okic') : `<button class="btn sm" data-act="quickGrade" data-room="${q.roomId}" data-user="${q.userId}" data-part="speaking">${L('Оценить спикинг', 'Grade speaking', 'Спикингті бағалау')}</button>`}</div>` : ''; }).join('')}` : ''),

function awayWidget(roomId){

    return `<div class="qitem ${t.frozen ? '' : 'st-called'}"><div class="row">${avatarOf(u, 'sm')}<div class="grow"><b class="ell">${esc(u.name)}</b><small class="ell">${esc(tmPartName(t))}${roomId ? '' : ' · ' + esc(r.title)}</small></div>
      ${t.frozen ? `<span class="chip ac">${ico('stop')}${L('Время остановлено', 'Time stopped', 'Уақыт тоқтатылды')}</span>` : `<span class="chip mid">${ico('clock')}${L('Время идёт', 'Time running', 'Уақыт жүріп жатыр')}</span>`}</div>
      <div class="qlive"><span class="muted">${L('Вышел', 'Left at', 'Шықты')} ${new Date(t.awayAt).toLocaleTimeString(LOC(), {hour:'2-digit', minute:'2-digit'})} · ${L('осталось', 'left', 'қалды')}</span><b class="num" data-tm="${t.id}">${fmtT(Math.max(0, tmLeft(t)))}</b></div>
      <div class="btns q-btns">${t.frozen ? `<button class="btn sec sm" data-act="tmResume" data-id="${esc(t.id)}">${ico('play')}${L('Возобновить время', 'Resume time', 'Уақытты жалғастыру')}</button>` : `<button class="btn sm" data-act="tmFreeze" data-id="${esc(t.id)}">${ico('stop')}${L('Остановить время', 'Stop time', 'Уақытты тоқтату')}</button>`}</div></div>`; }).join('')}</div>
    <div class="fhint">${L('Если студент вышел случайно, остановите время: время вне экзамена не засчитается, он продолжит с того же остатка.', 'If the student left by accident, stop the time: time away won’t count and they continue with the same time left.', 'Студент кездейсоқ шықса, уақытты тоқтатыңыз: емтиханнан тыс уақыт есептелмейді, ол сол қалған уақыттан жалғастырады.')}</div>`,
    { right:`<span class="chip mid">${list.length}</span>`, cls:'awaywidget' });
}

/* --- комната (преподаватель): прогресс студентов + очередь --- */
function cellFor(r, u, p, k){
  const g = p.grades[k];
  let s;
  if(ONLINE_SKILLS.includes(k)) s = p.test.done ? `${ico('check', 'okic')}${L('пройден', 'done', 'өтті')}${p.test.autoPct != null ? ` · ${p.test.autoPct}%` : ''}` : p.test.started ? `${p.test.n}/${p.test.of}` : '<span class="muted">—</span>';
  else if(k === 'writing') s = p.writing.done ? `${ico('check', 'okic')}${wordsTxt(p.writing.w.words)}` : '<span class="muted">—</span>';
  else { const q = p.speaking.q;
    s = !p.speaking.unlocked ? `<span class="muted">${ico('lock')}${L('закрыт', 'locked', 'жабық')}</span>` : !q ? `<span class="muted">${L('открыт', 'unlocked', 'ашық')}</span>`
      : q.status === 'done' ? `${ico('check', 'okic')}${fmtT(q.duration)}` : q.status === 'live' ? `<span class="c-low">${L('идёт', 'live', 'жүріп жатыр')}</span>` : q.status === 'called' ? `<span class="c-mid">${L('вызван', 'called', 'шақырылды')}</span>` : `${L('в очереди', 'queued', 'кезекте')} №${queuePos(q)}`; }
  return `<td><div class="cell">${s}</div>${g ? `<span class="sc ${'q-' + quality(pctOf(g.score, r[k].max))}">${fmtN(g.score)}</span>` : partDone(p, k) ? `<span class="chip mid">${L('ждёт', 'pending', 'күтуде')}</span>` : ''}</td>`;
}
function vRoomT(){
  const r = roomById(S.params.id);

  const st = roomStudents(r), parts = roomSkills(r);
  const rows = st.map(u => { const p = progress(r, u.id);
    const canQ = r.speaking.on && p.speaking.unlocked && !p.speaking.q;
    return `<tr><th scope="row"><div class="who">${avatarOf(u, 'sm')}<span>${esc(u.name)}<small>${esc(u.login)}</small></span></div></th>${parts.map(k => cellFor(r, u, p, k)).join('')}
      <td class="num tot">${p.anyGraded ? `<b>${fmtN(p.total)}</b>` : '—'}<small> / ${fmtN(roomMax(r))}</small></td>
      <td class="acts">${canQ ? `<button class="btn sec sm" data-act="qAdd" data-room="${r.id}" data-user="${u.id}">${ico('users')}${L('В очередь', 'Queue', 'Кезекке')}</button>` : ''}<button class="btn sm" data-act="openGrade" data-room="${r.id}" data-user="${u.id}">${ico('pen')}${L('Проверить', 'Grade', 'Тексеру')}</button></td></tr>`; }).join('');
  const table = st.length ? `<div class="tbl-wrap"><table class="sheet prog"><thead><tr><th scope="col">${L('Студент', 'Student', 'Студент')}</th>${parts.map(k => `<th scope="col">${partShort(k)}<small>/ ${fmtN(r[k].max)}</small></th>`).join('')}<th scope="col">${L('Итого', 'Total', 'Барлығы')}</th><th scope="col"><span class="sr">${L('Действия', 'Actions', 'Әрекеттер')}</span></th></tr></thead><tbody>${rows}</tbody></table></div>`
    : emptyBox('users', L('Студентов нет', 'No students', 'Студенттер жоқ'), '');
  const groups = `${audienceText(r)} · ${st.length} ${pl(st.length, 'студент', 'студента', 'студентов', 'student', 'students', 'студент')}`;
  const timeInfo = `${roomTimeLabel(r)} · ${L('длительность', 'duration', 'ұзақтығы')} ${roomDurationLabel(r)}`;
  const info = W(L('Состав экзамена', 'Exam parts', 'Емтихан құрамы'), `<div class="sumrow"><span class="sico sm">${ico('users')}</span><span class="grow">${L('Курсы и подгруппы', 'Courses and subgroups', 'Курстар мен подгруппалар')}<small>${esc(groups)}</small></span></div>
    <div class="sumrow"><span class="sico sm">${ico('clock')}</span><span class="grow">${L('Время экзамена', 'Exam time', 'Емтихан уақыты')}<small>${timeInfo}</small></span></div>` +
    parts.map(k => `<div class="sumrow"><span class="sico sm">${ico(partIcon(k))}</span><span class="grow">${partName(k)}<small>${
      k === 'test' ? roomTests(r).map(t => esc(t.title)).join(', ') : ONLINE_SKILLS.includes(k) ? L('в онлайн-тесте', 'in the online test', 'онлайн тестте') : k === 'writing' ? `${L('минимум', 'minimum', 'кемінде')} ${wordsTxt(r.writing.minWords)}${+r.writing.minutes > 0 ? ` · ${r.writing.minutes} ${L('мин', 'min', 'мин')}` : ''}` : `${r.speaking.minutes} ${L('мин на ответ', 'min per answer', 'мин жауапқа')} · ${spOrderName(spOrder(r))}`}</small></span><b class="num">${fmtN(r[k].max)}</b></div>`).join('') +
    `<div class="sumtotal"><span class="grow">${L('Максимум', 'Maximum', 'Максимум')}</span><b class="num">${fmtN(roomMax(r))}</b></div>
    <div class="btns col"><button class="btn sec" data-act="editRoom" data-id="${r.id}">${ico('edit')}${L('Редактировать', 'Edit', 'Өңдеу')}</button></div>`);
  return header(r.title, { back:'exam', sub:`<span class="chip ${roomStateCls(r)}">${ico('clock')}${roomTimeLabel(r)}</span>${roomCountdown(r)}` }) +
    awayWidget(r.id) + W(L('Прогресс студентов', 'Student progress', 'Студенттердің үлгерімі'), table) + `<div class="below">${queueWidget(r.id)}${info}</div>`;
}

/* --- проверка работы и выставление баллов --- */
function gaWidget(){
  const left = gaUntil() - Date.now();
  return W(L('Доступ к оценкам', 'Grading access', 'Бағалауға рұқсат'), left > 0
    ? `<div class="statebox done">${ico('unlock')}<div><b>${L('Открыт', 'Unlocked', 'Ашық')}</b><div class="sub">${L('Пароль действует ещё', 'Password valid for', 'Құпиясөздің қалған мерзімі')} <span class="num" data-ga>${fmtT(left)}</span></div></div></div><button class="btn sec block" data-act="gaLock">${ico('lock')}${L('Закрыть доступ сейчас', 'Lock now', 'Рұқсатты қазір жабу')}</button>`
    : `<div class="statebox lock">${ico('lock')}<div><b>${L('Закрыт', 'Locked', 'Жабық')}</b><div class="sub">${L('Чтобы выставить балл, введите пароль преподавателя. Он действует 1 час.', 'Enter the teacher password to grade. It stays valid for 1 hour.', 'Ұпай қою үшін оқытушы құпиясөзін енгізіңіз. Ол 1 сағат жарамды.')}</div></div></div><button class="btn block" data-act="gaUnlock">${ico('unlock')}${L('Ввести пароль', 'Enter password', 'Құпиясөзді енгізу')}</button>`);
}
function gradeForm(r, u, p, k, auto){
  const g = p.grades[k], max = r[k].max, can = partDone(p, k);
  if(!can) return `<div class="note">${ico('alert')}<span>${L('Часть ещё не сдана — балл можно выставить после сдачи.', 'This part is not submitted yet — you can grade it after submission.', 'Бөлім әлі тапсырылмаған — ұпайды тапсырылғаннан кейін қоюға болады.')}</span></div>`;
  return `<div class="gform"><div class="gf-row"><div><label class="f" for="sc-${k}">${L('Балл', 'Score', 'Ұпай')}</label><div class="scin"><input class="field num" id="sc-${k}" type="text" inputmode="decimal" autocomplete="off" aria-describedby="scmax-${k}" value="${g ? fmtN(g.score) : ''}"><span id="scmax-${k}">/ ${fmtN(max)}</span></div></div>
      ${auto != null ? `<button class="btn ghost sm" data-act="useAuto" data-part="${k}" data-v="${auto}">${ico('refresh')}${L('Подставить авто-балл', 'Use auto score', 'Авто-ұпайды қою')}: ${fmtN(auto)}</button>` : ''}</div>
    <label class="f" for="cm-${k}">${L('Комментарий для студента', 'Comment for the student', 'Студентке пікір')}</label><textarea class="field" id="cm-${k}" rows="2" placeholder="${L('Необязательно', 'Optional', 'Міндетті емес')}">${esc(g ? g.comment : '')}</textarea>
    <div class="gf-foot"><span class="sub">${g ? `${ico('check', 'okic')}${L('Выставлено', 'Graded', 'Қойылды')} ${fmtDate(g.gradedAt)}` : L('Ещё не оценено', 'Not graded yet', 'Әлі бағаланбаған')}</span>
      <button class="btn" data-act="saveGrade" data-part="${k}">${ico(gaOpen() ? 'check' : 'lock')}${g ? L('Обновить балл', 'Update score', 'Ұпайды жаңарту') : L('Выставить балл', 'Save score', 'Ұпай қою')}</button></div></div>`;
}
function gradePart(r, u, p, k, n){
  let body = '';
  if(k === 'test'){
    body = p.test.tests.map((t, i) => { const a = p.test.atts[i];
      if(!a) return `<div class="card prow"><p class="ttl">${esc(t.title)}</p><div class="meta">${L('Не пройден', 'Not taken', 'Өтпеген')}</div></div>`;
      return `<div class="card prow"><div class="row wrap"><div class="grow"><p class="ttl">${esc(t.title)}</p><div class="meta">${fmtN(a.score)} / ${fmtN(a.max)} · <b class="${Q_CLS[quality(a.percent, a.passPercent)]}">${a.percent}%</b><span class="dot">·</span>${fmtT(a.duration)}<span class="dot">·</span>${fmtDate(a.finishedAt)}</div></div>
        <button class="btn ghost sm" data-act="annul" data-id="${a.id}">${ico('undo')}${L('Аннулировать', 'Void attempt', 'Жарамсыз деп тану')}</button></div>
        <details class="rvd"><summary>${L('Ответы студента', 'Student’s answers', 'Студент жауаптары')} (${a.details.length})</summary>${reviewList(a, true)}</details></div>`; }).join('');
    body += p.test.skills.length > 1 ? p.test.skills.map(sk => `<div class="sect"><h2>${ico(partIcon(sk), 'okic')}${partName(sk)}</h2><span class="chip">${L('макс.', 'max', 'макс.')} ${fmtN(r[sk].max)}</span></div>${gradeForm(r, u, p, sk, p.test.autoBy[sk])}`).join('') : gradeForm(r, u, p, 'test', p.test.autoBy.test);
  } else if(k === 'writing'){
    const w = p.writing.w;
    body = `<div class="prompt">${esc(r.writing.prompt)}</div>${xPartMediaHTML(r, 'writing')}` + (w ? `<div class="essay">${esc(w.text)}</div><div class="meta">${w.auto ? `<span class="c-mid">${L('сдано автоматически — время вышло', 'auto-submitted — time’s up', 'автоматты түрде тапсырылды — уақыт бітті')}</span><span class="dot">·</span>` : ''}${wordsTxt(w.words)} ${w.words < r.writing.minWords ? `<span class="c-mid">(${L('меньше минимума', 'below minimum', 'ең аз шектен төмен')} ${r.writing.minWords})</span>` : ''}<span class="dot">·</span>${L('сдано', 'submitted', 'тапсырылды')} ${fmtDate(w.submittedAt)}</div>` : '') + gradeForm(r, u, p, k);
  } else {
    const q = p.speaking.q;
    body = `<div class="prompt">${esc(r.speaking.prompt)}</div>${xPartMediaHTML(r, 'speaking')}` +
      (q && q.status === 'done' ? `<div class="statebox done">${ico('clock')}<div><b>${L('Длительность', 'Duration', 'Ұзақтығы')}: ${fmtT(q.duration)}</b><div class="sub">${L('Лимит', 'Limit', 'Шегі')} ${r.speaking.minutes}:00 · ${fmtDate(q.startedAt)}</div></div></div>`
        : q ? `<div class="note">${ico('users')}<span>${L('Студент в очереди. Управляйте вызовом на странице комнаты.', 'The student is in the queue. Manage the call on the room page.', 'Студент кезекте. Шақыруды бөлме бетінде басқарыңыз.')}</span></div>`
        : p.speaking.unlocked ? `<button class="btn sec sm" data-act="qAdd" data-room="${r.id}" data-user="${u.id}">${ico('users')}${L('Поставить в очередь', 'Add to queue', 'Кезекке қою')}</button>` : '') + gradeForm(r, u, p, k);
  }
  if(k === 'test' && p.test.skills.length > 1){ const sk = p.test.skills, g = sk.filter(x => p.grades[x]);
    return W(stepTitle(n, k), body, { right: g.length === sk.length ? `<span class="sc q-${quality(pctOf(g.reduce((a, x) => a + p.grades[x].score, 0), sk.reduce((a, x) => a + (+r[x].max || 0), 0)))}">${fmtN(r2(g.reduce((a, x) => a + p.grades[x].score, 0)))} / ${fmtN(r2(sk.reduce((a, x) => a + (+r[x].max || 0), 0)))}</span>`
      : partDone(p, k) ? `<span class="chip mid">${L('Оценено', 'Graded', 'Бағаланды')} ${g.length} / ${sk.length}</span>` : `<span class="chip">${L('Не сдано', 'Not submitted', 'Тапсырылмаған')}</span>`, cls:'part' }); }
  return W(stepTitle(n, k), body, { right: p.grades[k] ? `<span class="sc ${'q-' + quality(pctOf(p.grades[k].score, r[k].max))}">${fmtN(p.grades[k].score)} / ${fmtN(r[k].max)}</span>` : partDone(p, k) ? `<span class="chip mid">${L('Ждёт оценки', 'Awaiting grade', 'Бағалауды күтуде')}</span>` : `<span class="chip">${L('Не сдано', 'Not submitted', 'Тапсырылмаған')}</span>`, cls:'part' });
}
function vGrade(){
  const r = roomById(S.params.room), u = userById(S.params.user);
  if(!r || !u) return header(L('Проверка', 'Grading', 'Тексеру'), {back:'exam'}) + emptyBox('pen', L('Работа не найдена', 'Work not found', 'Жұмыс табылмады'), '');
  const p = progress(r, u.id);
  let n = 0;
  return header(u.name, { back: S.params.tab || 'exam', sub: `${esc(r.title)} · ${L('проверка работы', 'grading', 'жұмысты тексеру')}` }) +
    cols(roomParts(r).map(k => gradePart(r, u, p, k, ++n)).join(''), gaWidget() + summaryWidget(r, p));
}

/* --- лист баллов --- */
function scoreTable(r){
  const st = roomStudents(r), parts = roomSkills(r), max = roomMax(r);
  const prs = st.map(u => [u, progress(r, u.id)]);
  const avg = k => { const v = prs.map(([, p]) => p.grades[k]).filter(Boolean); return v.length ? r2(v.reduce((s, g) => s + g.score, 0) / v.length) : null; };
  const full = prs.filter(([, p]) => p.allGraded);
  const rows = prs.map(([u, p]) => `<tr class="tap" role="button" tabindex="0" data-act="openGrade" data-room="${r.id}" data-user="${u.id}" data-tab="scores" data-q="${esc(scoreKey(u))}" ${scoreHit(u) ? '' : 'hidden'}>
      <th scope="row"><div class="who">${avatarOf(u, 'sm')}<span>${esc(u.name)}<small>${esc(u.login)}</small></span></div></th>
      ${parts.map(k => { const g = p.grades[k]; return `<td>${g ? `<span class="sc ${'q-' + quality(pctOf(g.score, r[k].max))}" title="${esc(g.comment || '')}">${fmtN(g.score)}</span>` : partDone(p, k) ? `<span class="chip mid">${L('ждёт', 'pending', 'күтуде')}</span>` : '<span class="muted">—</span>'}</td>`; }).join('')}
      <td class="num tot">${p.anyGraded ? `<b>${fmtN(p.total)}</b>` : '<span class="muted">—</span>'}</td>
      <td class="pctc">${p.allGraded ? `<div class="pcell"><b class="${Q_CLS[quality(pctOf(p.total, max))]}">${pctOf(p.total, max)}%</b>${meter(pctOf(p.total, max), 60)}</div>` : `<span class="muted">${p.anyGraded ? L('частично', 'partial', 'ішінара') : '—'}</span>`}</td></tr>`).join('');

  if(xe){ if(!S.xdraft || S.xdraft.id !== xe.id){ xLoadDraft(clone(xe), ''); S.xdraftBase = JSON.stringify(S.xdraft); } } else S.xdraft = null;
  const w = S.pwiz, st = pubSteps(); if(!xe){ w.step = 0; w.reach = 0; }
  const k = st[w.step], last = w.step === st.length - 1;
  const body = k === 'who' ? pubWhoStep(d, xe) : wzReviewStep(S.xdraft);
  const errs = S.errors.length ? `<div class="errs" id="errs" role="alert"><b>${L('Не опубликовано', 'Not published', 'Жарияланбады')}</b><ul>${S.errors.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '';
  const head = `<div class="wz-head"><span class="wz-hc">${wzIco(k)}</span><div class="grow"><small>${roomById(d.id) ? L('Публикация экзамена', 'Exam publication', 'Емтихан жариялымы') : L('Новая публикация', 'New publication', 'Жаңа жариялым')} · ${L('Шаг', 'Step', 'Қадам')} ${w.step + 1} ${L('из', 'of', '/')} ${st.length}${xe ? ' · ' + esc(xe.title) : ''}</small><h1>${esc(pubName(k))}</h1></div>
    <div class="wz-tools"><button type="button" class="ib ghost" data-act="pubExit" title="${L('Выйти', 'Leave', 'Шығу')}" aria-label="${L('Выйти из публикации', 'Leave publishing', 'Жариялаудан шығу')}">${ico('x')}</button></div></div>`;
  const dir = w.dir; w.dir = '';
  return `<div class="wz-stage ${dir && !effStill() ? 'wz-in-' + dir : ''}">${head}${body}${errs}</div>
    <div class="wz-bar" id="wzbar" role="navigation" aria-label="${L('Шаги публикации', 'Publishing steps', 'Жариялау қадамдары')}"></div>
    <div class="wz-actions"><button type="button" class="btn sec" data-act="pubPrev" ${w.step === 0 ? 'disabled' : ''}>${ico('back')}${L('Назад', 'Back', 'Артқа')}</button>
    <button type="button" class="btn" data-act="${last ? 'pubFinish' : 'pubNext'}">${last ? L('Опубликовать', 'Publish', 'Жариялау') : L('Вперёд', 'Next', 'Алға')}</button></div>`;
}
// публикация из мастера: правки шага «порядок, баллы и время» сохраняются в экзамен, комната заполняется из экзамена
function pubFinish(){
  const d = S.rdraft; if(!d) return;
  const xe0 = xReady() ? xRoomExam(d) : null;
  if(!xe0 || !S.xdraft){ S.errors = [L('Выберите экзамен', 'Choose an exam', 'Емтиханды таңдаңыз')]; S.pwiz.step = 0; render(); return; }
  const e = S.xdraft.exam, sk = wzSkills(e), errs = [];
  if(!String(d.title || '').trim()) errs.push(L('Укажите название для студентов', 'Enter the title for students', 'Студенттерге арналған атауды енгізіңіз'));
  if(!sk.length) errs.push(L('В экзамене не выбрано ни одного навыка', 'The exam has no skills selected', 'Емтиханда бірде-бір дағды таңдалмаған'));
  sk.forEach(k => { if(!(+e.settings.skillPoints[k] > 0)) errs.push(xSecName(e, k) + ': ' + L('укажите баллы за навык', 'set the points for the skill', 'дағды ұпайын көрсетіңіз')); });
  if(pubWhen(d) === 'at' && isNaN(parseLocal(d.examStart))) errs.push(L('Укажите дату и время публикации', 'Set the publication date and time', 'Жариялау күні мен уақытын көрсетіңіз'));
  errs.push(...xValidate(S.xdraft));
  if(errs.length){ S.errors = errs; if(!String(d.title || '').trim() || (pubWhen(d) === 'at' && isNaN(parseLocal(d.examStart)))) S.pwiz.step = 0; render(); const el = document.getElementById('errs'); if(el) el.scrollIntoView({ block:'center', behavior:effStill() ? 'auto' : 'smooth' }); return; }
  // экзамен: сохранить порядок, баллы и время
  if(xDirty() && !xSaveDraft({ quiet:true, noRender:true })) return;
  const rec = testById(S.xdraft.id); if(!isExamT(rec)) return;
  const keepTitle = d.title, keepMin = d.speaking.minutes;
  xFillRoom(d, rec, true, 100); d.title = keepTitle;
  roomSkills(d).forEach(k => { if(+rec.exam.settings.skillPoints[k] > 0) d[k].max = +rec.exam.settings.skillPoints[k]; });
  d.speaking.minutes = +rec.exam.settings.skillTime.speaking > 0 ? +rec.exam.settings.skillTime.speaking : (+keepMin || 5);
  d.speaking.order = 'any'; d.xorder = wzSkills(rec.exam); d.xmode = 1; // порядок навыков для прохождения студентом
  if(pubWhen(d) === 'now' && !roomById(d.id)) d.examStart = '';
  { const wp = xPartFrom(XM.normalize(clone(rec.exam)), 'writing'); if(wp) d.writing.minWords = wp.minWords || 0; }
  if(d.writing.on && !String(d.writing.prompt || '').trim()) d.writing.prompt = xSecName(rec.exam, 'writing');
  if(d.speaking.on && !String(d.speaking.prompt || '').trim()) d.speaking.prompt = xSecName(rec.exam, 'speaking');
  d.cover = '';
  S.errors = validateRoom(d);
  if(S.errors.length){ render(); return; }
  S.xdraft = null; S.pwiz = null;
  ACT.saveRoom();
}

/* ========== КОНСТРУКТОР ЭКЗАМЕНОВ (exam builder) ==========

   так его можно выбрать в комнате, он синхронизируется, копируется и удаляется так же, как обычный тест.
   Онлайн (часть «Тест» комнаты) проходятся разделы «Тестовая часть», «Чтение», «Аудирование» — с автопроверкой;
   письменная часть и говорение переносятся в части комнаты «Письменная работа» и «Спикинг».
   Библиотеки — папка eb/: model.js подключён сразу, остальное (JSZip, Word, плеер для HTML) грузится по требованию. */

const XB_LOADED = {};
// библиотеки грузятся строго по очереди: docx-export и docx-import при загрузке берут ExamModel и MiniXML
function ebLoad(files){
  return files.reduce((p, f) => p.then(() => XB_LOADED[f] || (XB_LOADED[f] = new Promise((ok, fail) => {
    const s = document.createElement('script'); s.src = 'eb/' + f;
    s.onload = ok; s.onerror = () => { delete XB_LOADED[f]; s.remove(); fail(new Error(L('не удалось загрузить ', 'could not load ', 'жүктеу мүмкін болмады: ') + 'eb/' + f)); };
    document.head.appendChild(s);

}

const xRoomsUsing = id => D.rooms.filter(r => r.test.testIds.includes(id) || r.writing.xsrc === id || r.speaking.xsrc === id);

// новый экзамен: пустой или из документа / проекта / демо (тогда он сразу «изменён» — уход без сохранения спросит подтверждение)

function xValidate(rec){

  if(!(+e.settings.timeLimit >= 0)) er.push(L('Время не может быть отрицательным', 'Time cannot be negative', 'Уақыт теріс болмауы керек'));
  if(!(+rec.passPercent >= 0 && +rec.passPercent <= 100)) er.push(L('Проходной порог — от 0 до 100 %', 'Pass mark must be between 0 and 100%', 'Өту шегі — 0-ден 100 %-ға дейін'));

let pendingXMedia = null;
function xNormImage(src, type){
  return new Promise(ok => { const img = new Image();
    img.onload = () => { const good = /image\/(png|jpeg|gif)/.test(type), max = 1600;
      if(good && img.width <= max && img.height <= max) return ok(src);
      const k = Math.min(1, max / img.width, max / img.height), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      ok(type === 'image/jpeg' ? c.toDataURL('image/jpeg', .88) : c.toDataURL('image/png')); };
    img.onerror = () => ok(null); img.src = src; });
}

function xAppend(dst, src){

    if(!to.instructions && from.instructions) to.instructions = from.instructions;
    to.media = to.media.concat(from.media);
    const lim = XM.SECTION_LIMITS[k];

// тексты для разбора попытки — в формате обычного теста (тип, ответ студента, правильный ответ)
function xUserText(t, a){
  if(!xAnswered(a)) return '—';
  switch(t.type){
    case 'mc': return t.options[a] != null ? xLet(a) + ') ' + t.options[a] : '—';
    case 'multi': return a.slice().sort((x, y) => x - y).map(j => xLet(j) + ') ' + (t.options[j] || '')).join('; ');
    case 'tf': return XM.TF_VARIANTS[t.variant][a] || '—';
    case 'match': return t.left.map((_, i) => (i + 1) + '–' + (a[i] != null ? xLet(a[i]) : '?')).join(', ');
    case 'gap': return a.map(v => v || '…').join('; ');
    case 'short': return String(a);
  }
  return String(a);
}
function xCorrText(t){
  switch(t.type){
    case 'mc': return t.answer != null ? xLet(t.answer) + ') ' + t.options[t.answer] : '';
    case 'multi': return t.answers.slice().sort((x, y) => x - y).map(j => xLet(j) + ') ' + t.options[j]).join('; ');
    case 'tf': return t.answer != null ? XM.TF_VARIANTS[t.variant][t.answer] : '';
    case 'match': return t.left.map((_, i) => (i + 1) + '–' + (t.answer[i] != null ? xLet(t.answer[i]) : '?')).join(', ');
    case 'gap': return XM.parseGaps(t.question).filter(p => p.gap).map(p => p.answers.join(' / ') || '?').join('; ');
    case 'short': return String(t.answer || '').split('|').join(' / ');
  }
  return '';
}
function xTaskText(t){
  if(t.type === 'gap') return XM.parseGaps(t.question).map(p => p.gap ? '____' : p.text).join('').trim();
  if(t.type === 'match') return (t.question || L('Установите соответствие.', 'Match the items.', 'Сәйкестендіріңіз.')) + '\n' + t.left.map((l, i) => (i + 1) + '. ' + l).join('\n') + '\n' + t.right.map((x, j) => xLet(j) + '. ' + x).join('\n');
  return t.question || '';
}
// оценивание прохождения: задания без ключа пропускаются (их нельзя засчитать), эссе — только в предпросмотре и без баллов
function xGradeRun(r){
  const e = r.test.exam, details = [];
  r.secs.forEach(k => { e.sections[k].tasks.forEach(t => {
    if(t.type === 'info' || t.type === 'essay' || !xKeyed(t)) return;
    const a = r.answers[t.id], g = XM.grade(t, a), earned = r1(g.score), max = r2(g.max);
    const status = !xAnswered(a) ? 'empty' : earned >= max ? 'correct' : earned > 0 ? 'partial' : 'wrong';
    details.push({ text:xTaskText(t), type:XPORTAL[t.type] || 'input', sec:xSecName(e, k), skill:k, time:null, earned, max, status, user:xUserText(t, a), corr:xCorrText(t) });
  }); });
  // итог: сумма по навыкам, каждый навык округлён вниз до половинок
  const bySkill = {}; details.forEach(d => { const b = bySkill[d.skill] = bySkill[d.skill] || { score:0, max:0 }; b.score += d.earned; b.max += d.max; });
  Object.keys(bySkill).forEach(k => { bySkill[k].score = floorHalf(bySkill[k].score); bySkill[k].max = r2(bySkill[k].max); });
  return { details, bySkill, score:r2(Object.keys(bySkill).reduce((s, k) => s + bySkill[k].score, 0)), max:r2(details.reduce((s, d) => s + d.max, 0)) };
}

/* --- комната из экзамена: тест + письменная работа + спикинг, баллы и время из экзамена --- */
function xPartFrom(e, k){
  if(!xHasPart(e, k)) return null;
  const s = e.sections[k], essays = s.tasks.filter(t => t.type === 'essay'), nums = XM.numberTasks(s), parts = [];
  if(s.instructions.trim()) parts.push(s.instructions.trim());
  s.tasks.forEach((t, i) => {
    if(t.type === 'info'){ if(t.kind !== 'transcript' && (t.title || t.text)) parts.push([t.title, t.text].filter(Boolean).join('\n')); return; }
    const meta = [];
    if(t.minWords && t.maxWords) meta.push(t.minWords + '–' + t.maxWords + ' ' + L('слов', 'words', 'сөз')); else if(t.minWords) meta.push(L('не менее ', 'at least ', 'кемінде ') + wordsTxt(t.minWords));
    if(t.timeMinutes) meta.push(t.timeMinutes + L(' мин', ' min', ' мин'));
    const q = String(t.question || '').trim(), dup = t.minWords && q.includes(String(t.minWords)); // объём уже указан в тексте задания
    parts.push((essays.length > 1 ? L('Задание ', 'Task ', 'Тапсырма ') + nums[i] + '. ' : '') + q + (meta.length && !dup ? ' (' + meta.join(', ') + ')' : ''));
  });
  return { prompt:parts.join('\n\n'), minWords:essays.reduce((n, t) => n + (+t.minWords || 0), 0), minutes:essays.reduce((n, t) => n + (+t.timeMinutes || 0), 0), points:r2(essays.reduce((n, t) => n + (+t.points || 0), 0)) };
}

function addToQueue(roomId, userId){
  const r = roomById(roomId); if(!r || !r.speaking.on) return;
  if(!isT() && (!roomAccess(r) || !roomForUser(r, ME))){ toast(L('Экзамен недоступен', 'The exam is unavailable', 'Емтихан қолжетімсіз')); return; }
  const p = progress(r, userId);
  if(!p.speaking.unlocked){ toast(L('Спикинг откроется после теста и письменной работы', 'Speaking unlocks after the test and writing', 'Спикинг тест пен жазбаша жұмыстан кейін ашылады')); return; }
  if(queueFor(roomId, userId)){ toast(L('Уже в очереди', 'Already in the queue', 'Кезекте бар')); return; }
  D.queue.push({ id:uid(), roomId, userId, status:'waiting', addedAt:Date.now(), by:ME.id }); persist(); render();
  toast(isT() ? L('Студент поставлен в очередь', 'Student added to the queue', 'Студент кезекке қойылды') : L('Вы в очереди на спикинг', 'You joined the speaking queue', 'Сіз спикинг кезегіне тұрдыңыз'));
}
function putGrade(r, u, part, score, comment){
  const old = gradeFor(r.id, u.id, part);
  score = floorHalf(+score); // балл за навык — вниз до половинок
  const g = { roomId:r.id, userId:u.id, part, score, max:+r[part].max, comment, gradedAt:Date.now(), by:ME.id };
  if(old) Object.assign(old, g); else D.grades.push(g);
  persist(); render(); toast(L('Балл выставлен: ', 'Score saved: ', 'Ұпай қойылды: ') + partName(part) + ' — ' + fmtN(score) + ' / ' + fmtN(+r[part].max));
}
// оценка одной части (спикинг) без проверки всей работы: тест и письмо можно проверить позже
function quickGrade(roomId, userId, part){
  const r = roomById(roomId), u = userById(userId); if(!r || !u || !r[part]) return;
  const max = +r[part].max, old = gradeFor(r.id, u.id, part); let val = null;
  formModal(partName(part) + ': ' + u.name, [
    { k:'score', label:L('Балл', 'Score', 'Ұпай') + ` (0–${fmtN(max)})`, im:'decimal' },
    { k:'comment', label:L('Комментарий для студента', 'Comment for the student', 'Студентке пікір'), multi:true, rows:2 }],
    old ? { score:fmtN(old.score), comment:old.comment || '' } : {}, v => {
      const raw = String(v.score).replace(',', '.'), n = /^\d+(\.\d+)?$/.test(raw) ? parseFloat(raw) : NaN;
      if(raw === '' || isNaN(n) || n < 0 || n > max) return L(`Балл должен быть от 0 до ${fmtN(max)}`, `Score must be between 0 and ${fmtN(max)}`, `Ұпай 0 мен ${fmtN(max)} аралығында болуы керек`);
      val = { score:r2(n), comment:v.comment };
    }, { ok:L('Выставить балл', 'Save score', 'Ұпай қою'), cancel:L('Позже', 'Later', 'Кейінірек'),
      text:L('Оценивается только эта часть. Тест и письменную работу можно проверить позже — балл за неё сохранится.', 'Only this part is graded. The test and writing can be checked later — this score is kept.', 'Тек осы бөлім бағаланады. Тест пен жазбаша жұмысты кейін тексеруге болады — бұл ұпай сақталады.'),
      after:() => { if(val) withGradeAuth(() => putGrade(r, u, part, val.score, val.comment)); } });
}
function saveGrade(part){
  const r = roomById(S.params.room), u = userById(S.params.user); if(!r || !u) return;
  const inp = document.getElementById('sc-' + part), cm = document.getElementById('cm-' + part);
  const raw = String(inp.value).replace(',', '.').trim(), v = /^\d+(\.\d+)?$/.test(raw) ? parseFloat(raw) : NaN, max = +r[part].max;
  if(raw === '' || isNaN(v) || v < 0 || v > max){ toast(L(`Балл должен быть от 0 до ${fmtN(max)}`, `Score must be between 0 and ${fmtN(max)}`, `Ұпай 0 мен ${fmtN(max)} аралығында болуы керек`)); inp.focus(); return; }
  const comment = cm.value.trim(), score = floorHalf(v);
  withGradeAuth(() => putGrade(r, u, part, score, comment));
}

      list.push({ id:XM.uid('m'), kind, name:f.name, src }); xChanged(); };
    if(kind !== 'image') put(fr.result); else xNormImage(fr.result, f.type).then(put); };
  fr.readAsDataURL(f);
});
document.getElementById('xbdocx').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  if(S.view === 'xbList'){ xWordModal(f); return; }
  if(S.view !== 'xbImport') go('xbImport', {}); xHandleDocx(f); });
// мастер: стрелки клавиатуры, перерисовка полосы при изменении размера окна
document.addEventListener('keydown', e => {
  if(!document.body.classList.contains('wz') || document.querySelector('.ov') || e.altKey || e.ctrlKey || e.metaKey) return;
  const t = e.target; if(t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT|AUDIO|VIDEO)$/.test(t.tagName))) return;
  if(e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const fwd = e.key === 'ArrowRight';
  if(S.view === 'xbEditor' && S.wiz){ e.preventDefault(); if(fwd) wzNext(); else if(S.wiz.step > 0) wzGo(S.wiz.step - 1); }
  else if(S.view === 'roomEditor' && S.pwiz){ e.preventDefault(); if(fwd){ if(S.pwiz.step < pubSteps().length - 1) pubGo(S.pwiz.step + 1); else pubFinish(); } else pubGo(S.pwiz.step - 1); }
  else if(S.view === 'run' && S.run && S.run.mode === 'room'){ e.preventDefault(); if(fwd && S.run.sec === S.run.secs.length - 1) rrFinishAsk(); else rrGo(S.run.sec + (fwd ? 1 : -1)); }
});
/* шаг «обзор»: плашки навыков перетаскиваются после зажатия (мышь ~0,2 с, палец ~0,35 с).
   Номера слева — места, они не двигаются; у края экрана страница сама прокручивается. */
let WZD = null;
function wzApplyOrder(keys){
  const st = S.xdraft.exam.settings;
  if(!st.customOrder){ st.order = XM.SECTION_TYPES.slice(); st.customOrder = true; }
  let j = 0; st.order = st.order.map(k => keys.includes(k) ? keys[j++] : k); // выключенные навыки остаются на своих местах
}
function wzDragStart(){
  const d = WZD; if(!d || d.drag) return;
  const card = d.card, r = card.getBoundingClientRect();
  d.drag = true; d.off = d.y - r.top;
  d.ph = document.createElement('div'); d.ph.className = 'wz-ph'; d.ph.style.height = r.height + 'px';
  card.parentNode.insertBefore(d.ph, card);
  d.cells = [...document.querySelectorAll('#wzRv .wz-cell')];
  d.items = d.cells.map(c => c.firstElementChild === card ? d.ph : c.firstElementChild);
  card.classList.remove('wz-press'); card.classList.add('wz-drag');
  card.style.left = r.left + 'px'; card.style.width = r.width + 'px'; card.style.top = r.top + 'px';
  document.body.appendChild(card); document.body.classList.add('wz-dragging');
  try{ navigator.vibrate && navigator.vibrate(15); }catch(e){}
  const loop = () => { if(!WZD || !WZD.drag) return;
    const bar = document.getElementById('wzbar'), bottom = innerHeight - (bar ? bar.offsetHeight : 0), edge = 90; let v = 0;
    if(d.y < edge) v = -Math.ceil((edge - d.y) / 5) - 2; else if(d.y > bottom - edge) v = Math.ceil((d.y - bottom + edge) / 5) + 2;
    if(v){ const y0 = scrollY; window.scrollBy(0, v); if(scrollY !== y0) wzDragMove(); }
    d.raf = requestAnimationFrame(loop); };
  d.raf = requestAnimationFrame(loop);
}
function wzDragMove(){
  const d = WZD; if(!d || !d.drag) return;
  d.card.style.top = (d.y - d.off) + 'px';
  for(let guard = 0; guard < 8; guard++){
    const i = d.items.indexOf(d.ph), prev = d.items[i - 1], next = d.items[i + 1];
    const mid = el => { const b = el.getBoundingClientRect(); return b.top + b.height / 2; };
    let j = -1;
    if(prev && d.y < mid(prev)) j = i - 1; else if(next && d.y > mid(next)) j = i + 1;
    if(j < 0) break;
    [d.items[i], d.items[j]] = [d.items[j], d.items[i]];
    d.items.forEach((el, k) => { if(d.cells[k].firstElementChild !== el) d.cells[k].appendChild(el); });
  }
}
function wzDragEnd(cancel){
  const d = WZD; WZD = null; if(!d) return;
  clearTimeout(d.hold); d.card.classList.remove('wz-press');
  if(!d.drag) return;
  cancelAnimationFrame(d.raf); document.body.classList.remove('wz-dragging');
  const keys = d.items.map(el => el === d.ph ? d.card.dataset.k : el.dataset.k);
  d.card.classList.remove('wz-drag'); d.card.style.left = d.card.style.top = d.card.style.width = '';
  d.ph.replaceWith(d.card);
  if(cancel || !S.xdraft) return;
  const before = wzSkills(S.xdraft.exam).join();
  wzApplyOrder(keys);
  if(wzSkills(S.xdraft.exam).join() === before) return;
  if(S.wiz){ S.wiz.step = wzSteps().length - 1; S.wiz.reach = Math.max(S.wiz.reach, S.wiz.step); }
  const y = scrollY; xChanged(); window.scrollTo(0, y);
}
document.addEventListener('pointerdown', e => {
  const card = e.target.closest && e.target.closest('#wzRv .wz-rv'); if(!card || e.button > 0 || WZD) return;
  if(e.target.closest('input,button,select,textarea,summary,a,label,.wz-rd[open]')) return;
  WZD = { card, x:e.clientX, y:e.clientY, sx:e.clientX, sy:e.clientY, mouse:e.pointerType === 'mouse', drag:false };
  card.classList.add('wz-press');
  WZD.hold = setTimeout(wzDragStart, WZD.mouse ? 200 : 350);
});
document.addEventListener('pointermove', e => {
  const d = WZD; if(!d) return;
  d.x = e.clientX; d.y = e.clientY;
  if(!d.drag){ const far = Math.hypot(d.x - d.sx, d.y - d.sy) > 8; if(far){ if(d.mouse) wzDragStart(); else wzDragEnd(true); } return; }
  e.preventDefault(); wzDragMove();
});
document.addEventListener('pointerup', () => { if(WZD) wzDragEnd(false); });
document.addEventListener('pointercancel', () => { if(WZD) wzDragEnd(!WZD.drag); });
document.addEventListener('touchmove', e => { if(WZD && WZD.drag) e.preventDefault(); }, { passive:false });
document.addEventListener('contextmenu', e => { if(WZD) e.preventDefault(); });
let wzRT = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(wzRT); wzRT = requestAnimationFrame(() => { if(document.body.classList.contains('wz')) wzMount(true); }); });
// лимит воспроизведений аудио/видео в задании: считается каждое прослушивание до конца
document.addEventListener('ended', e => { const el = e.target; if(!el || !el.dataset || !el.dataset.plays) return; const r = xR(); if(!r) return;
  r.aux = r.aux || {}; const pl = r.aux.plays = r.aux.plays || {}; pl[el.dataset.mk] = (pl[el.dataset.mk] || 0) + 1;
  if(!r.preview && typeof saveRun === 'function') saveRun(); render(); }, true);
['dragover', 'dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest && e.target.closest('.xb-drop'); if(!z) return;
  e.preventDefault();
  if(ev === 'dragover') z.classList.add('over'); else z.classList.remove('over');
  if(ev === 'drop' && e.dataTransfer && e.dataTransfer.files[0]) xHandleDocx(e.dataTransfer.files[0]);
}));
document.addEventListener('keydown', e => {
  const ovs = document.querySelectorAll('.ov');
  if(e.key === 'Escape' && ovs.length){ ovs[ovs.length - 1]._close(); return; }
  if(ovs.length) return;
  const el = e.target;
  if((e.key === 'Enter' || e.key === ' ') && el.getAttribute && el.getAttribute('role') === 'button' && el.dataset.act){ e.preventDefault(); el.click(); return; }
  if(S.view !== 'run' || !S.run) return;
  if(S.run.kind === 'exam'){ // экзамен: Enter в пропуске — к следующему пропуску, остальные сочетания не перехватываются
    if(e.key === 'Enter' && el.classList && el.classList.contains('gapin')){ e.preventDefault(); const all = [...app.querySelectorAll('.gapin')], nx = all[all.indexOf(el) + 1]; if(nx) nx.focus(); }
    return; }
  if(e.key === 'Enter' && el.classList && el.classList.contains('gapin')){ e.preventDefault();
    const all = [...app.querySelectorAll('.gapin')], nx = all[all.indexOf(el) + 1];
    if(nx) nx.focus(); else { const b = app.querySelector('.dock [data-act="nextQ"],.dock [data-act="finish"]'); if(b) b.click(); } return; }
  if(e.key === 'Enter' && el.id === 'ansInput'){ e.preventDefault(); const b = app.querySelector('.dock [data-act="nextQ"],.dock [data-act="finish"]'); if(b) b.click(); return; }
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || e.altKey || e.ctrlKey || e.metaKey) return;
  if(e.key === 'ArrowRight'){ moveTo(S.run.pos + 1); return; }
  if(e.key === 'ArrowLeft'){ moveTo(S.run.pos - 1); return; }
  const d = /^[1-9]$/.test(e.key) ? +e.key - 1 : -1; if(d < 0) return;
  const q = curQ();
  if(q.type === 'tf' && d < 2) ACT.aTf({dataset:{v: d === 0 ? '1' : '0'}});
  else if((q.type === 'single' || q.type === 'multi') && d < q.options.length) ACT[q.type === 'single' ? 'aSingle' : 'aMulti']({dataset:{j:String(d)}});
});

/* ---------- синхронизация между вкладками ---------- */
const LIVE = { publish:1, exam:1, room:1, grade:1, scores:1, results:1, editorList:1, builder:1, result:1, xbList:1 };
const fieldFocused = () => { const a = document.activeElement; return !!a && app.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox' && a.type !== 'radio'; };
window.addEventListener('storage', e => {
  if(e.key === THEME_KEY || e.key === MODE_KEY){ COLOR = colorOf(lsGet(THEME_KEY)); const m = lsGet(MODE_KEY); MODE = MODES.includes(m) ? m : 'auto'; applyTheme(); render(); refreshSettings(); }
  else if(e.key === GA_KEY && S.view === 'grade' && !document.querySelector('.ov')) render();
});
setInterval(() => { tick(); if(S.syncPending && !fieldFocused() && !document.querySelector('.ov')) render(); }, 1000);

window.addEventListener('pagehide', () => { try{ tmPresence(true); }catch(e){} });
/* ---------- старт ---------- */
(function init(){
  applyLang(); applyTheme();
  D = normDB({});
  ME = null;

  S.view = 'login';
  try{ history.replaceState({view:S.view, params:{}, depth:(hs && hs.depth) || 0}, ''); }catch(e){ HIST = false; }
  render();
})();
syncStart().catch(e => { console.error('[exam-sync] session restore:', e); render(); });
